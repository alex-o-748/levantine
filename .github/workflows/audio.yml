name: Fetch and build word audio

# Wikimedia is unreachable from some development environments, and the corpus
# is far too large to carry in git. A runner has open network access and a
# throwaway disk, so it does the fetching: it pulls a Lingua Libre category,
# rebuilds the clips the app ships, and commits only those plus an inventory of
# what the category holds.
on:
  workflow_dispatch:
    inputs:
      category:
        description: Commons category to fetch
        default: Category:Lingua Libre pronunciation by AdrianAbdulBaha
        required: true
      iso:
        description: Lingua Libre language codes to keep ("all" for every language)
        default: ajp,apc
        required: true
      download:
        description: Download the media (off = inventory only, no media)
        type: boolean
        default: true
      limit:
        description: Stop after N files (0 = all; use a small number to rehearse)
        default: "0"
        required: false

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runner images no longer ship ffmpeg, and the check that was meant to
      # catch that could not fail: `ffmpeg -version | head -1` exits with head's
      # status, so a missing binary passed and only build_audio.py noticed —
      # after a 37-minute download, in a step marked continue-on-error. Install
      # it, then assert it is really there.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # The media is gitignored and the runner is ephemeral, so without a cache
      # every run re-downloads several hundred megabytes from Wikimedia.
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: corpus/commons
          key: commons-${{ hashFiles('tools/corpus-inventory.json') }}
          restore-keys: commons-

      # Inputs travel via env, never interpolated into the script: GitHub
      # expands ${{ }} before the shell parses the line, so a quote in an input
      # would otherwise run as a command.
      # A cache from before downloads were named off the Commons title holds
      # files called "…wav?utm_source=commons.wikimedia.org&…". The suffix is
      # not .wav, so the indexer skips them and the fetcher, which looks for the
      # corrected name, re-downloads them anyway. Drop them.
      - name: Drop downloads named from the old URL form
        run: find corpus -type f -name '*.wav?*' -delete -print | wc -l

      - name: Fetch from Commons
        env:
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
          ISO: ${{ inputs.iso }}
        run: |
          python3 tools/fetch-commons-audio.py \
            --category "$CATEGORY" \
            --inventory tools/corpus-inventory.json \
            --limit "$LIMIT" \
            --iso "$ISO" \
            ${{ inputs.download && '--download' || '' }}

      # A run once reported files downloaded while the next step found an empty
      # corpus. Unexplained, so the tree is printed rather than trusted.
      - name: What actually landed on disk
        if: ${{ inputs.download }}
        run: |
          echo "corpus tree:"
          find corpus -maxdepth 2 -type d -print
          echo "audio files: $(find corpus -type f \( -name '*.wav' -o -name '*.ogg' \) | wc -l)"
          echo "leftover .part: $(find corpus -type f -name '*.part' | wc -l)"
          find corpus -type f | head -5

      # Informational: a throttled run can legitimately come back with nothing,
      # and that should not mask the download diagnostics above.
      - name: What the corpus now holds
        if: ${{ inputs.download }}
        continue-on-error: true
        run: python3 tools/build_audio.py --report

      # This one must not be forgiving. The clips are the whole point of the
      # run, and the app has no synthesised fallback behind them: a build that
      # fails quietly ships a silent word list and a green tick.
      - name: Build the clips the app ships
        if: ${{ inputs.download }}
        run: python3 tools/build_audio.py

      # Saved whatever the build's verdict — actions/cache only saves on success,
      # and a selection bug threw away a 37-minute download once already. The
      # download is the expensive half of this job; a later step failing is no
      # reason to pay for it twice. The cache is visible to this branch and the
      # default branch only, so a sibling branch still starts cold.
      - name: Save corpus cache
        if: ${{ always() && inputs.download }}
        uses: actions/cache/save@v4
        with:
          path: corpus/commons
          key: commons-${{ github.run_id }}

      - name: Commit
        env:
          CATEGORY: ${{ inputs.category }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio tools/corpus-inventory.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Rebuild word audio from Commons" \
                     -m "Category: $CATEGORY" -m "Run: $RUN_URL"
          git push
